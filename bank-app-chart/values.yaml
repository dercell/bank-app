global:
  security:
    allowInsecureImages: true

ingress:
  enabled: true
  className: nginx
  host: bank-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/enable-underscores-in-headers: "true"
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, X-User-Info"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"

postgresql:
  image:
    registry: docker.io
    repository: library/postgres
    tag: 15
  auth:
    username: bank_admin
    password: bank_admin
    database: bank_db
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "hostpath"
    service:
      type: NodePort
      ports:
        postgresql: 5432
      nodePorts:
        postgresql: "30432"
    initdb:
      scripts:
        init.sql: |
          CREATE SCHEMA IF NOT EXISTS keycloak;
          CREATE SCHEMA IF NOT EXISTS accounts;
accounts:
  service:
    port: 8081
  configMap:
    enabled: true
    env:
      KEYCLOAK_CLIENT_ID: accounts-service
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8080/realms/bank-app
      KEYCLOAK_TOKEN_URI: http://host.docker.internal:8080/realms/bank-app/protocol/openid-connect/token
      APP_PORT: "8081"
      ACCOUNT_DB_URL: jdbc:postgresql://bank-app-postgresql:5432/bank_db?currentSchema=accounts
      ACCOUNT_USERNAME: bank_admin
      BANK_API_URL: http://bank-api
  secret:
    enabled: true
    env:
      KEYCLOAK_CLIENT_SECRET: z4YSPCjeXtZWb5qkwaL0YOrRGs4TP2Go

