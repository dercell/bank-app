{{- range $path, $content := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-dashboard-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: bank-app
data:
  {{ $name }}.json: |-
{{ $.Files.Get $path | indent 4 }}
---
{{- end }}
