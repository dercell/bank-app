{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "transfer.fullname" . }}-secret
  labels:
    {{- include "transfer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.env }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}