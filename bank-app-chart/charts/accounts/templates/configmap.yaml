{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accounts.fullname" . }}-config
  labels:
    {{- include "accounts.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.env }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}