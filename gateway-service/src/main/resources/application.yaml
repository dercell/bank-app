server:
  port: 8087

spring:
  application:
    name: gateway
  config:
    import: "consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: gateway
      config:
        watch:
          delay: 3000
          enabled: true
          wait-time: 5
        enabled: true
        defaultContext: application
        data-key: data
        format: yaml

management:
  endpoints:
    web:
      exposure:
        include: "*"


