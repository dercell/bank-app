spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:8080/realms/bank-app
      client:
        registration:
          keycloak:
            client-id: accounts-service
            client-secret: z4YSPCjeXtZWb5qkwaL0YOrRGs4TP2Go
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: http://host.docker.internal:8080/realms/bank-app

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  liquibase:
    enabled: false
  sql:
    init:
      mode: never

  jpa:
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

bank:
  accounts-service:
    base-url: http://localhost:8888

custom:
  baseUrl:
    api-gateway: http://bank-api