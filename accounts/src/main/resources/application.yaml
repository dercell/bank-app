spring:
  profiles:
    active: prod
  application:
    name: accounts
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/bank_db?currentSchema=accounts}
    username: ${ACCOUNT_USERNAME:postgres}
    password: ${ACCOUNT_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    default-schema: accounts
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.trusted.packages: ru.yandex.practicum.accounts.model

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://host.docker.internal:8080/realms/bank-app}



management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
server:
  port: ${APP_PORT:8081}

custom:
  baseUrl:
    api-gateway: ${BANK_API_URL:http://localhost:8084} #http://gateway
  kafka:
    notification-topic: ${BANK_APP_NOTIFICATION_TOPIC:bank-app-notification}

---
spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:accounts-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:z4YSPCjeXtZWb5qkwaL0YOrRGs4TP2Go}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://host.docker.internal:8080/realms/bank-app}