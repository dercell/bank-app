<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Банк</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="alert alert-danger vstack" role="alert" th:if="${errors!=null}" th:each="error : ${errors}">
    <span th:text="${error}"/>
</div>
<div class="alert alert-success" role="alert" th:if="${info!=null}" th:text="${info}"/>
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <span class="badge text-bg-info text-white">Банк</span>
                </h2>
                <div class="d-flex ms-auto">
                    <a th:href="@{/logout}" class="btn btn-secondary bi bi-box-arrow-in-left"> Выйти</a>
                </div>
            </div>
        </div>
    </div>
    <div class="row p-2">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    Обо мне
                </div>
                <div class="card-body gap-3">
                    <form method="post" th:action="@{/account}">
                        <div class="form-group">
                            <h6>
                                <label for="name">Фамилия Имя</label>
                            </h6>
                            <p>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Иванов Иван"
                                       th:value="${name}" required>
                            </p>
                        </div>
                        <div class="form-group">
                            <h6>
                                <label for="birthdate">Дата рождения</label>
                            </h6>
                            <p>
                                <input type="date" class="form-control" name="birthdate" id="birthdate"
                                       th:value="${birthdate}" required>
                            </p>
                        </div>
                        <div class="form-group">
                            <h6>
                                <label for="from_account">Счет</label>
                            </h6>
                            <p>
                                <select class="form-select" id="from_account" name="accountNumber" onchange="syncSelectedAccount(this.value)" required>
                                    <option th:each="acc : ${user_accounts}"
                                            th:value="${acc.accountNumber}"
                                            th:text="${acc.accountNumber + ' (баланс: ' + acc.balance + ' руб.)'}"/>
                                </select>
                            </p>
                        </div>

                        <button type="submit" class="btn btn-secondary">Сохранить изменения</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row p-2">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    Операции с наличными
                </div>
                <div class="card-body gap-3">
                    <form method="post" th:action="@{/cash}">
                        <input type="hidden" id="selectedAccount" name="accountNumber"
                               th:value="${selectedAccount}">
                        <div class="form-group">
                            <h6>
                                <label for="cash_value">Сумма, руб.</label>
                            </h6>
                            <p>
                                <input type="number" class="form-control" id="cash_value" name="value" placeholder="100"
                                       required>
                            </p>
                        </div>
                        <button type="submit" class="btn btn-secondary" name="action" value="PUT">Положить</button>
                        <button type="submit" class="btn btn-secondary" name="action" value="GET">Снять</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row p-2">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    Переводы
                </div>
                <div class="card-body gap-3">
                    <form method="post" th:action="@{/transfer}">
                        <div class="form-group">
                            <h6>
                                <label for="to_account">На счет</label>
                            </h6>
                            <p>
                                <select class="form-select" id="to_account" name="accountNumber" required>
                                    <optgroup th:each="r : ${recipients}" th:label="${r.username}">
                                        <option th:each="acc : ${r.accounts}"
                                                th:value="${acc.accountNumber}"
                                                th:text="${acc.accountNumber}"/>
                                    </optgroup>
                                </select>
                            </p>
                        </div>
                        <div class="form-group">
                            <h6>
                                <label for="transfer_value">Сумма, руб.</label>
                            </h6>
                            <p>
                                <input type="text" class="form-control" name="value" id="transfer_value"
                                       placeholder="100" required>
                            </p>
                        </div>
                        <button type="submit" class="btn btn-secondary">Перевести</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

<script>
    function syncSelectedAccount(accountNumber) {
        document.getElementById('selectedAccount').value = accountNumber;
        document.getElementById('displayAccount').textContent = accountNumber;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const select = document.getElementById('from_account');
        const hidden = document.getElementById('selectedAccount');
        const display = document.getElementById('displayAccount');

        if (hidden && hidden.value) {
            for (let option of select.options) {
                if (option.value === hidden.value) {
                    option.selected = true;
                    break;
                }
            }
            display.textContent = hidden.value;
        } else if (select && select.value) {
            hidden.value = select.value;
            display.textContent = select.value;
        }
    });
</script>

</html>
