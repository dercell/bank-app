spring:
  profiles:
    active: prod
  application:
    name: cash
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://host.docker.internal:8080/realms/bank-app}
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:cash-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:Op9oxqitQbCeLm3sV7OykkjkNo8CmKbs}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://host.docker.internal:8080/realms/bank-app}

custom:
  baseUrl:
    api-gateway: ${BANK_API_URL:http://bank-api}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
server:
  port: ${APP_PORT:8082}
